<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#0D1B3E"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="cc">
      <circle cx="55" cy="55" r="50"/>
    </clipPath>
  </defs>

  <!-- Logo icon -->
  <g transform="translate(5,5)">
    <circle cx="55" cy="55" r="50" fill="none" stroke="url(#gd)" stroke-width="3"/>
    <g clip-path="url(#cc)">
      <path d="M55 5 A50 50 0 0 0 55 105 A25 25 0 0 0 55 55 A25 25 0 0 1 55 5Z" fill="url(#gd)"/>
      <path d="M55 5 A50 50 0 0 1 55 105 A25 25 0 0 1 55 55 A25 25 0 0 0 55 5Z" fill="url(#gl)"/>
      <!-- Wave -->
      <path d="M55 7 Q46 20 55 30 Q64 40 55 55 Q46 70 55 80 Q64 90 55 103" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <!-- Dark side nodes -->
      <g fill="#4FC3F7" stroke="#4FC3F7" stroke-width="0.6">
        <line x1="30" y1="25" x2="42" y2="35" opacity="0.6"/>
        <line x1="30" y1="25" x2="22" y2="40" opacity="0.6"/>
        <line x1="42" y1="35" x2="22" y2="40" opacity="0.6"/>
        <line x1="42" y1="35" x2="35" y2="50" opacity="0.6"/>
        <line x1="22" y1="40" x2="18" y2="55" opacity="0.6"/>
        <line x1="22" y1="40" x2="35" y2="50" opacity="0.6"/>
        <line x1="35" y1="50" x2="18" y2="55" opacity="0.6"/>
        <line x1="18" y1="55" x2="28" y2="65" opacity="0.6"/>
        <line x1="38" y1="18" x2="30" y2="25" opacity="0.6"/>
        <line x1="38" y1="18" x2="42" y2="35" opacity="0.6"/>
        <circle cx="30" cy="25" r="2.5"/>
        <circle cx="42" cy="35" r="2"/>
        <circle cx="22" cy="40" r="2.5"/>
        <circle cx="35" cy="50" r="2"/>
        <circle cx="18" cy="55" r="2"/>
        <circle cx="38" cy="18" r="1.8"/>
        <circle cx="28" cy="65" r="1.8"/>
      </g>
      <!-- Light side nodes -->
      <g fill="#0D1B3E" stroke="#0D1B3E" stroke-width="0.6">
        <line x1="75" y1="65" x2="85" y2="78" opacity="0.5"/>
        <line x1="75" y1="65" x2="65" y2="75" opacity="0.5"/>
        <line x1="85" y1="78" x2="78" y2="90" opacity="0.5"/>
        <line x1="65" y1="75" x2="78" y2="90" opacity="0.5"/>
        <line x1="65" y1="75" x2="68" y2="88" opacity="0.5"/>
        <line x1="78" y1="90" x2="68" y2="88" opacity="0.5"/>
        <line x1="82" y1="60" x2="75" y2="65" opacity="0.5"/>
        <line x1="82" y1="60" x2="90" y2="70" opacity="0.5"/>
        <line x1="90" y1="70" x2="85" y2="78" opacity="0.5"/>
        <circle cx="75" cy="65" r="2.5"/>
        <circle cx="85" cy="78" r="2"/>
        <circle cx="65" cy="75" r="2"/>
        <circle cx="78" cy="90" r="2.5"/>
        <circle cx="82" cy="60" r="1.8"/>
        <circle cx="90" cy="70" r="1.8"/>
        <circle cx="68" cy="88" r="1.8"/>
      </g>
    </g>
  </g>

  <!-- "W" in accent gradient -->
  <text x="130" y="78" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="48" fill="url(#gt)">W</text>
  <!-- "ebTuria" in white -->
  <text x="162" y="78" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="48" fill="#F0F0F5">ebTuria</text>
</svg>
